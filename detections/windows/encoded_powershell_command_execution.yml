# Learning exercise using sigma 

title: Encoded Powershell Command Execution 
status: experimental
description: Detects PowerShell processes launched with encoded command-line arguments.
author: Hangarsj
date: 2026-08-14 

logsource:
  product: windows 
  category: process_creation 

detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
  
  selection_args:
    CommandLine|contains:
      - ' -e '
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection and selection_args

level: medium 
tags: 
  - attack.execution
  - attack.t1059.001
falsepositives: 
- Legitimate administrative PowerShell scripts using encoded commands
- Security testing and red team activity


